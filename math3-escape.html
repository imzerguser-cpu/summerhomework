<title>🔐 3학년 수학 방탈출</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
:root{--navy:#1B2E4A;--navy-g:#3B6BA5;--sky:#4DA3E8;--sky-p:#E8F4FD;--red:#E0465A;--green:#2DAA6E;--bg:#F3F5F8;--card:#FFF;--tx:#1E2D3D;--tx2:#6B7D8F;--tx3:#A4B3C2;--bdr:#E0E7EF;--sh:0 1px 4px rgba(27,46,74,.07);--r:12px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh;overflow-x:hidden;}
.hd{background:linear-gradient(135deg,var(--navy),var(--navy-g));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:space-between;}
.hd-l{display:flex;flex-direction:column;}
.hd-title{font-size:16px;font-weight:900;}
.hd-name{font-size:11px;opacity:.75;margin-top:1px;}
.sync-ind{font-size:10px;opacity:.85;display:flex;align-items:center;gap:4px;}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.sync-on{background:#4ADE80;}.sync-off{background:#F59E0B;}.sync-err{background:#EF4444;}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 40px;}
.btn{border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:800;transition:.12s;}
.btn:active{transform:scale(.97);}
.btn-lg{padding:16px;font-size:17px;width:100%;color:#fff;}
.btn-primary{background:linear-gradient(135deg,var(--sky),var(--navy-g));}
.btn-sub{background:#fff;color:var(--navy);border:2px solid var(--bdr);}
.btn-green{background:var(--green);color:#fff;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px;}
/* 이름 입력 */
.name-row{display:flex;gap:8px;margin-top:14px;}
.txt-inp{flex:1;padding:12px;border:2px solid var(--bdr);border-radius:10px;font-size:16px;font-family:inherit;}
.txt-inp:focus{border-color:var(--sky);outline:none;}
/* 방 그리드 */
.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(min-width:600px){.room-grid{grid-template-columns:repeat(3,1fr);}}
.room-card{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:16px 10px;text-align:center;border:2px solid transparent;}
.room-card.done{border-color:var(--green);background:#F0FBF5;}
.room-emoji{font-size:30px;}
.room-name{font-size:12.5px;font-weight:800;margin-top:4px;}
.room-prog{font-size:11.5px;color:var(--tx2);margin-top:3px;font-weight:700;}
.room-bar{height:6px;background:#E7ECF2;border-radius:3px;margin-top:6px;overflow:hidden;}
.room-bar-f{height:100%;background:var(--sky);border-radius:3px;transition:width .3s;}
.room-card.done .room-bar-f{background:var(--green);}
.scan-fab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));z-index:40;}
.scan-fab button{padding:18px;border-radius:16px;font-size:18px;box-shadow:0 6px 20px rgba(27,46,74,.35);}
.name-switch{font-size:11px;color:var(--tx3);text-align:center;margin-top:18px;text-decoration:underline;cursor:pointer;}
/* 스캔 화면 */
.scan-wrap{text-align:center;}
.cam-box{position:relative;width:100%;max-width:420px;margin:10px auto;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;}
.cam-box video{width:100%;height:100%;object-fit:cover;}
.cam-frame{position:absolute;inset:14%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);}
.cam-msg{font-size:12px;color:var(--tx2);margin:8px 0;}
.manual-box{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-top:16px;}
.manual-box h4{font-size:13px;color:var(--tx2);margin-bottom:8px;}
.manual-row{display:flex;gap:8px;}
.manual-row .txt-inp{text-transform:uppercase;}
.top-back{font-size:13px;color:var(--sky);font-weight:800;cursor:pointer;margin-bottom:10px;display:inline-block;}
/* 문제 화면: 가로 분할 */
.q-split{display:flex;min-height:min(560px,72vh);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:#fff;}
@media(max-width:640px){.q-split{flex-direction:column;min-height:0;}}
.q-left{flex:1;padding:16px;overflow-y:auto;border-right:2px dashed var(--bdr);}
@media(max-width:640px){.q-left{border-right:none;border-bottom:2px dashed var(--bdr);}}
.q-right{flex:1;display:flex;flex-direction:column;background:#fcfcfd;min-height:0;}
/* 세로로 좁은 화면(폰)에서는 .q-right가 flex:1만으로는 높이를 못 받아 풀이 공간이
   찌부러지는 문제가 있어서, 최소 높이를 직접 지정해 항상 그릴 수 있는 영역을 확보함 */
@media(max-width:640px){.q-right{min-height:45vh;flex:none;}}
.q-badges{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;}
.b-id{background:var(--navy);color:#fff;}
.b-room{background:var(--sky-p);color:var(--navy-g);}
.b-unit{background:#F0F3F7;color:var(--tx2);}
.qimg-wrap{margin:10px 0;text-align:center;background:#FAFBFC;border:1px solid #E5EAEF;border-radius:10px;padding:10px;}
.qimg-wrap svg{width:100%;height:auto;max-width:340px;display:block;margin:0 auto;}
.q-text{font-size:15.5px;font-weight:600;margin:8px 0 12px;line-height:1.6;}
.ans-row{display:flex;gap:8px;margin-top:6px;}
.ans-row .txt-inp{text-transform:none;}
.time3-row{display:flex;align-items:center;gap:6px;margin:10px 0;flex-wrap:wrap;}
.time3-row input{width:52px;padding:10px 4px;text-align:center;border:2px solid var(--bdr);border-radius:8px;font-size:16px;font-family:inherit;}
.time3-row input:focus{border-color:var(--sky);outline:none;}
.time3-row .tu{font-size:13px;font-weight:800;color:var(--tx2);}
.vsub{background:#FAFBFC;border:1px solid #E5EAEF;border-radius:10px;padding:12px 14px;margin:10px 0;font-family:'Courier New',monospace;}
.vsub .vr{display:flex;justify-content:flex-end;gap:4px;align-items:center;font-size:16px;font-weight:800;color:var(--navy);}
.vsub .vr .op{width:16px;text-align:left;color:var(--tx2);}
.vsub .vr span.num{min-width:30px;text-align:right;}
.vsub .vr span.u{font-size:11px;color:var(--tx2);font-weight:700;margin-right:6px;}
.vsub .hr{border-top:2px solid var(--navy);margin:6px 0;}
.fb-box{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;font-weight:800;text-align:center;}
.fb-ok{background:#E8F9EF;color:var(--green);border:1px solid #B9EDCB;}
.fb-bad{background:#FDEEEF;color:var(--red);border:1px solid #F5C6CB;}
.fb-review{background:#EAF2FB;color:var(--navy-g);border:1px solid #C7DCF2;}
.center-icon{font-size:38px;text-align:center;margin-bottom:4px;}
/* 풀이 공간 캔버스 */
.scr-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bdr);}
.scr-hd .lbl{font-size:12px;font-weight:800;color:var(--tx2);display:flex;align-items:center;gap:5px;}
.scr-tools{display:flex;gap:6px;}
.scr-tools button{border:1px solid var(--bdr);background:#fff;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--tx);cursor:pointer;}
.scr-tools button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.canvas-wrap{flex:1;position:relative;touch-action:none;}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
.finale{text-align:center;padding:40px 16px;}
.finale .em{font-size:64px;}
.finale h2{font-size:22px;margin:10px 0;color:var(--navy);}
.finale p{font-size:14px;color:var(--tx2);line-height:1.7;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border-radius:16px;padding:26px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.25);}
.modal-box .em{font-size:56px;}
.modal-box h3{font-size:19px;margin:8px 0;color:var(--navy);}
.modal-box p{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:16px;}

/* ===================== 상태 ===================== */
let myName=localStorage.getItem("math3_name")||"";
let safeKey=localStorage.getItem("math3_key")||"";
let solvedIds={};
let unlocked={};
let helpRequest=null;
let dbRef=null,myLastSaveTs=0,saveTimer=null;
let view="home",activeQid=null,pendingFinale=false;
let videoStream=null,scanRAF=null;
let canvasCtx=null,drawing=false,lastX=0,lastY=0;

function sanitizeKey(name){
  return name.trim().replace(/[.#$\[\]\/]/g,"_").slice(0,40);
}
function findQ(qid){const rid=qid.slice(0,2);return (QUESTIONS[rid]||[]).find(q=>q.qid===qid);}
function normalize(s){return (s||"").toString().trim().replace(/\s+/g,"").toLowerCase();}
function roomProgress(rid){return QUESTIONS[rid].filter(q=>solvedIds[q.qid]).length;}
function totalSolved(){return ROOMS.reduce((sum,r)=>sum+roomProgress(r.id),0);}
function loadLocal(){
  if(!safeKey)return;
  try{const d=JSON.parse(localStorage.getItem("math3_state_"+safeKey)||"{}");solvedIds=d.solvedIds||{};}catch(e){}
}
function persistLocal(){if(!safeKey)return;localStorage.setItem("math3_state_"+safeKey,JSON.stringify({solvedIds}));}

function connectFirebase(){
  if(!safeKey)return;
  dbRef=db.ref("math3_escape_data/students/"+safeKey);
  let firstSync=true;
  dbRef.on("value",snap=>{
    setSync("on");
    const d=snap.val();
    if(d){
      if(!(d.ts&&Math.abs(d.ts-myLastSaveTs)<2000)){
        solvedIds=d.solvedIds||{};
        persistLocal();
      }
      unlocked=d.unlocked||{};
      helpRequest=d.helpRequest||null;
    }
    if(view==="home")renderHome();
    if(firstSync){
      firstSync=false;
      // 접속하자마자 서버에 존재를 등록해서 관리자 대시보드에 바로 보이도록 함
      saveCloud();
    }
  },()=>setSync("err"));
}
function setSync(s){
  const dot=document.getElementById("syncDot"),txt=document.getElementById("syncTxt");
  if(!dot)return;
  dot.className="sync-dot "+(s==="on"?"sync-on":s==="err"?"sync-err":"sync-off");
  txt.textContent=s==="on"?"연결됨":s==="err"?"연결 오류(오프라인 저장중)":"연결 중";
}
function saveCloud(){
  persistLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    if(!dbRef)return;
    myLastSaveTs=Date.now();
    // update()를 써야 함: set()을 쓰면 work/unlocked/helpRequest 같은 다른 하위 데이터가 통째로 지워짐
    dbRef.update({displayName:myName,solvedIds,ts:myLastSaveTs}).then(()=>setSync("on")).catch(()=>setSync("err"));
  },400);
}
function saveWorkSnapshot(qid){
  if(!dbRef)return;
  const canvas=document.getElementById("scratchCanvas");
  if(!canvas)return;
  try{
    const dataUrl=canvas.toDataURL("image/png");
    dbRef.child("work/"+qid).set(dataUrl);
  }catch(e){}
}
function requestHelp(roomId){
  const room=ROOMS.find(r=>r.id===roomId);
  if(!room||!dbRef)return;
  const roomQids=QUESTIONS[roomId].map(x=>x.qid);
  const solvedCount=roomQids.filter(id=>solvedIds[id]).length;
  if(solvedCount>=5)return;
  const nextQid=roomQids[solvedCount];
  if(!confirm(room.emoji+" "+room.name+"의 다음 QR 코드를 못 찾으시겠어요?\n선생님께 도움을 요청할까요?"))return;
  const req={qid:nextQid,roomId:roomId,roomName:room.name,ts:Date.now()};
  dbRef.child("helpRequest").set(req).then(()=>{
    helpRequest=req;
    if(view==="home")renderHome();
  });
}
function cancelHelp(){
  if(dbRef)dbRef.child("helpRequest").remove();
  helpRequest=null;
  if(view==="home")renderHome();
}
function openUnlocked(qid){
  if(dbRef)dbRef.child("helpRequest").remove();
  helpRequest=null;
  showQuestionScreen(qid,"active");
}

/* ===================== 렌더 ===================== */
const app=document.getElementById("app");
function setHeader(){
  document.getElementById("hdName").textContent=myName?(myName+" 학생"):"이름 입력 전";
  const lo=document.getElementById("hdLogout");
  if(lo)lo.style.display=myName?"":"none";
}

function renderNameEntry(){
  setHeader();
  app.innerHTML='<div class="card"><h2 style="font-size:16px;margin-bottom:6px;">이름을 입력해주세요</h2>'
    +'<p style="font-size:12px;color:var(--tx2);">입력한 이름으로 진행 상황이 저장돼요. 같은 이름으로 다시 접속하면 이어서 할 수 있어요.</p>'
    +'<div class="name-row"><input class="txt-inp" id="nameInp" placeholder="이름 입력" maxlength="20"><button class="btn btn-primary" style="padding:0 20px" onclick="submitName()">입장하기</button></div>'
    +'</div>';
  const inp=document.getElementById("nameInp");
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")submitName();});
  inp.focus();
}
function submitName(){
  const v=document.getElementById("nameInp").value.trim();
  if(!v){alert("이름을 입력해주세요.");return;}
  myName=v;
  safeKey=sanitizeKey(v);
  localStorage.setItem("math3_name",myName);
  localStorage.setItem("math3_key",safeKey);
  loadLocal();
  connectFirebase();
  view="home";renderHome();
}
function switchName(){
  if(!confirm("로그아웃할까요? (지금까지의 진행상황은 서버에 그대로 저장되어 있어서, 나중에 같은 이름으로 다시 들어오면 이어할 수 있어요)"))return;
  myName="";safeKey="";
  localStorage.removeItem("math3_name");localStorage.removeItem("math3_key");
  if(dbRef){dbRef.off();dbRef=null;}
  solvedIds={};
  setHeader();
  view="name";renderNameEntry();
}

function renderHome(){
  setHeader();
  const total=totalSolved();
  let h="";
  if(total===30){
    h+='<div class="finale"><div class="em">🎉🏆✨</div><h2>전체 미션 성공!</h2><p>6개 방 30문제를 모두 풀었어요!<br>선생님께 완료했다고 알려주세요.</p></div>';
  }
  h+='<div class="room-grid">';
  ROOMS.forEach(r=>{
    const p=roomProgress(r.id),done=p===5;
    let extra="";
    if(!done){
      const roomQids=QUESTIONS[r.id].map(x=>x.qid);
      const nextQid=roomQids[p];
      if(unlocked[nextQid]){
        extra='<button class="btn btn-green" style="width:100%;margin-top:6px;padding:6px;font-size:10.5px;font-weight:800;" onclick="openUnlocked(\''+nextQid+'\')">🔓 선생님이 열어주셨어요!</button>';
      }else if(helpRequest&&helpRequest.qid===nextQid){
        extra='<div style="margin-top:6px;font-size:10px;color:#b45309;font-weight:800;">🙋 요청함 · 기다려주세요<br><span style="text-decoration:underline;cursor:pointer;color:var(--tx3);font-weight:600;" onclick="cancelHelp()">요청 취소</span></div>';
      }else{
        extra='<div style="margin-top:6px;font-size:10px;color:var(--tx3);text-decoration:underline;cursor:pointer;" onclick="requestHelp(\''+r.id+'\')">🙋 QR을 못 찾겠어요</div>';
      }
    }
    h+='<div class="room-card'+(done?" done":"")+'"><div class="room-emoji">'+r.emoji+"</div>"
      +'<div class="room-name">'+r.name+"<br><span style=\"font-weight:600;color:var(--tx2);font-size:10.5px\">"+r.unit+"</span></div>"
      +'<div class="room-prog">'+(done?"✔ 완료!":p+" / 5")+"</div>"
      +'<div class="room-bar"><div class="room-bar-f" style="width:'+(p/5*100)+'%"></div></div>'+extra+'</div>';
  });
  h+="</div>";
  h+='<div style="height:90px"></div>';
  h+='<div class="scan-fab"><button class="btn btn-lg btn-primary" onclick="openScan()">📷 QR 스캔하기</button></div>';
  app.innerHTML=h;
  if(pendingFinale){pendingFinale=false;showFinaleModal();}
}
function showFinaleModal(){
  const ov=document.createElement("div");
  ov.className="modal-ov";
  ov.innerHTML='<div class="modal-box"><div class="em">🎉🏆✨</div><h3>전체 미션 성공!</h3><p>6개 방 30문제를 모두 풀었어요!<br>선생님께 완료했다고 알려주세요.</p><button class="btn btn-lg btn-primary" onclick="this.closest(\'.modal-ov\').remove()">확인</button></div>';
  document.body.appendChild(ov);
}

function openScan(){
  view="scan";
  app.innerHTML='<div class="scan-wrap"><div class="top-back" onclick="goHome()">← 홈으로</div>'
    +'<div class="cam-box"><video id="vid" playsinline muted autoplay></video><div class="cam-frame"></div></div>'
    +'<div class="cam-msg" id="camMsg">카메라를 QR 코드에 비춰주세요</div>'
    +'<div class="manual-box"><h4>카메라가 안 되면 문제 번호를 직접 입력하세요 (예: B1Q1)</h4>'
    +'<div class="manual-row"><input class="txt-inp" id="manualInp" placeholder="B1Q1" maxlength="5"><button class="btn btn-sub" style="padding:0 16px" onclick="submitManual()">확인</button></div></div>'
    +"</div>";
  document.getElementById("manualInp").addEventListener("keydown",e=>{if(e.key==="Enter")submitManual();});
  startCamera();
}
function goHome(){stopCamera();view="home";renderHome();}
function submitManual(){
  const v=document.getElementById("manualInp").value.trim().toUpperCase();
  if(!/^B[1-6]Q[1-5]$/.test(v)){alert("문제 번호 형식이 올바르지 않아요. 예: B1Q1");return;}
  stopCamera();handleScan(v);
}
async function startCamera(){
  try{
    videoStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const vid=document.getElementById("vid");
    if(!vid)return;
    vid.srcObject=videoStream;
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    function tick(){
      if(view!=="scan")return;
      if(vid.readyState===vid.HAVE_ENOUGH_DATA){
        const vw=vid.videoWidth,vh=vid.videoHeight;
        const sq=Math.min(vw,vh);
        const sx0=(vw-sq)/2,sy0=(vh-sq)/2;
        const inset=sq*0.14;
        const gx=sx0+inset,gy=sy0+inset,gsize=sq*0.72;
        canvas.width=gsize;canvas.height=gsize;
        ctx.drawImage(vid,gx,gy,gsize,gsize,0,0,gsize,gsize);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height);
        if(code&&code.data){
          const v=code.data.trim().toUpperCase();
          if(/^B[1-6]Q[1-5]$/.test(v)){stopCamera();handleScan(v);return;}
        }
      }
      scanRAF=requestAnimationFrame(tick);
    }
    scanRAF=requestAnimationFrame(tick);
  }catch(e){
    const msg=document.getElementById("camMsg");
    if(msg)msg.textContent="카메라를 사용할 수 없어요. 아래에 문제 번호를 직접 입력하세요.";
  }
}
function stopCamera(){
  if(scanRAF)cancelAnimationFrame(scanRAF);
  scanRAF=null;
  if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null;}
}

function handleScan(qid){
  const q=findQ(qid);
  if(!q){alert("존재하지 않는 문제예요.");view="home";renderHome();return;}
  const rid=qid.slice(0,2);
  if(solvedIds[qid]){showQuestionScreen(qid,"review");return;}
  const roomQids=QUESTIONS[rid].map(x=>x.qid);
  const solvedCount=roomQids.filter(id=>solvedIds[id]).length;
  const requiredQid=roomQids[solvedCount];
  if(qid!==requiredQid&&!unlocked[qid]){showQuestionScreen(qid,"locked",requiredQid);return;}
  showQuestionScreen(qid,"active");
}

function roomOf(qid){return ROOMS.find(r=>r.id===qid.slice(0,2));}

function showQuestionScreen(qid,mode,requiredQid){
  view="question";activeQid=qid;
  const q=findQ(qid);
  const room=roomOf(qid);

  let h='<div class="top-back" onclick="goHome()">← 홈으로</div>';
  h+='<div class="q-split">';
  h+='<div class="q-left">';
  h+='<div class="q-badges"><span class="badge b-id">'+qid+"</span><span class=\"badge b-room\">"+room.emoji+" "+room.name+"</span><span class=\"badge b-unit\">"+q.tag+"</span></div>";

  if(mode==="locked"){
    h+='<div class="center-icon">🔒</div><div class="fb-box fb-review">아직 이 문제를 열 수 없어요!<br>이 방은 순서대로 풀어야 해요.<br>지금 풀어야 할 문제: <b>'+requiredQid+"</b></div>";
    h+='<button class="btn btn-lg btn-primary" style="margin-top:12px" onclick="requestHelp(\''+room.id+"');goHome();\">🙋 선생님께 도움 요청하기</button>";
    h+="</div><div class=\"q-right\"></div></div>";
    h+='<button class="btn btn-lg btn-sub" style="margin-top:12px" onclick="goHome()">홈으로</button>';
    app.innerHTML=h;
    return;
  }

  if(q.img)h+='<div class="qimg-wrap">'+q.img+"</div>";
  h+='<div class="q-text">'+q.text+"</div>";

  if(q.type==="time3"&&q.timeVisual){
    const tv=q.timeVisual;
    h+='<div class="vsub"><div class="vr"><span class="op"></span><span class="num">'+tv.h1+'</span><span class="u">시</span><span class="num">'+tv.m1+'</span><span class="u">분</span><span class="num">'+tv.s1+'</span><span class="u">초</span></div>'
      +'<div class="vr"><span class="op">−</span><span class="num"></span><span class="u"></span><span class="num">'+tv.m2+'</span><span class="u">분</span><span class="num">'+tv.s2+'</span><span class="u">초</span></div>'
      +'<div class="hr"></div></div>';
  }

  if(mode==="review"){
    let ansShown=q.type==="time3"?(q.timeAns.h+"시 "+q.timeAns.m+"분 "+q.timeAns.s+"초"):q.answer;
    h+='<div class="fb-box fb-review">✅ 이미 푼 문제예요<br>정답: <b>'+ansShown+"</b></div>";
    h+='</div>';
    h+=renderScratchPane();
    h+="</div>";
    h+='<button class="btn btn-lg btn-sub" style="margin-top:12px" onclick="goHome()">홈으로</button>';
    app.innerHTML=h;
    initCanvas();
    return;
  }

  // active
  if(q.type==="time3"){
    h+='<div class="time3-row"><input type="number" id="ans_h" placeholder="시"><span class="tu">시</span><input type="number" id="ans_m" placeholder="분"><span class="tu">분</span><input type="number" id="ans_s" placeholder="초"><span class="tu">초</span><button class="btn btn-green" id="submitBtn" style="padding:0 16px" onclick="submitAnswer()">제출</button></div>';
  }else{
    h+='<div class="ans-row"><input class="txt-inp" id="ansInp" placeholder="정답 입력" autocomplete="off" autocapitalize="off"><button class="btn btn-green" id="submitBtn" style="padding:0 18px" onclick="submitAnswer()">제출</button></div>';
  }
  h+='<div id="fbArea"></div>';
  h+="</div>";
  h+=renderScratchPane();
  h+="</div>";
  app.innerHTML=h;
  initCanvas();
  const inp=document.getElementById("ansInp");
  if(inp){inp.addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer();});inp.focus();}
}

function renderScratchPane(){
  return '<div class="q-right">'
    +'<div class="scr-hd"><span class="lbl">✏️ 풀이 공간</span><div class="scr-tools"><button onclick="clearScratch()">🗑 지우기</button></div></div>'
    +'<div class="canvas-wrap" id="canvasWrap"><canvas id="scratchCanvas"></canvas></div>'
    +'</div>';
}

function initCanvas(){
  const wrap=document.getElementById("canvasWrap");
  const canvas=document.getElementById("scratchCanvas");
  if(!wrap||!canvas)return;
  // 캔버스 크기는 화면 진입 시 한 번만 정한다. (모바일에서 정답칸을 눌러 키보드가 뜨면
  // window resize 이벤트가 발생하는데, 그때마다 다시 크기를 잡으면 그림이 지워지는 문제가 있었음)
  const rect=wrap.getBoundingClientRect();
  canvas.width=rect.width||wrap.offsetWidth||300;
  canvas.height=rect.height||wrap.offsetHeight||300;
  canvasCtx=canvas.getContext("2d");
  canvasCtx.lineWidth=2.5;canvasCtx.lineCap="round";canvasCtx.lineJoin="round";canvasCtx.strokeStyle="#1E2D3D";
  canvas.style.touchAction="none";
  function posFromClient(clientX,clientY){
    const r=canvas.getBoundingClientRect();
    return {x:clientX-r.left,y:clientY-r.top};
  }
  function startDraw(x,y){drawing=true;lastX=x;lastY=y;}
  function moveDraw(x,y){
    if(!drawing||!canvasCtx)return;
    canvasCtx.beginPath();canvasCtx.moveTo(lastX,lastY);canvasCtx.lineTo(x,y);canvasCtx.stroke();
    lastX=x;lastY=y;
  }
  function stopDraw(){drawing=false;}

  // Pointer Events (대부분의 최신 브라우저)
  canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const p=posFromClient(e.clientX,e.clientY);startDraw(p.x,p.y);
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  },{passive:false});
  canvas.addEventListener("pointermove",e=>{
    if(!drawing)return;
    e.preventDefault();
    const p=posFromClient(e.clientX,e.clientY);moveDraw(p.x,p.y);
  },{passive:false});
  canvas.addEventListener("pointerup",stopDraw);
  canvas.addEventListener("pointercancel",stopDraw);
  canvas.addEventListener("pointerleave",stopDraw);

  // Touch Events (일부 태블릿 브라우저는 Pointer Events를 지원하지 않아 이 경로가 필요함)
  canvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    const t=e.touches[0];if(!t)return;
    const p=posFromClient(t.clientX,t.clientY);startDraw(p.x,p.y);
  },{passive:false});
  canvas.addEventListener("touchmove",e=>{
    e.preventDefault();
    const t=e.touches[0];if(!t)return;
    const p=posFromClient(t.clientX,t.clientY);moveDraw(p.x,p.y);
  },{passive:false});
  canvas.addEventListener("touchend",e=>{e.preventDefault();stopDraw();},{passive:false});
  canvas.addEventListener("touchcancel",e=>{e.preventDefault();stopDraw();},{passive:false});

  // Mouse Events (PC 테스트용)
  canvas.addEventListener("mousedown",e=>{const p=posFromClient(e.clientX,e.clientY);startDraw(p.x,p.y);});
  canvas.addEventListener("mousemove",e=>{if(drawing){const p=posFromClient(e.clientX,e.clientY);moveDraw(p.x,p.y);}});
  window.addEventListener("mouseup",stopDraw);
}
function clearScratch(){
  const canvas=document.getElementById("scratchCanvas");
  if(canvas&&canvasCtx)canvasCtx.clearRect(0,0,canvas.width,canvas.height);
}

function submitAnswer(){
  const qid=activeQid,q=findQ(qid);
  const fb=document.getElementById("fbArea");
  let correct=false;
  if(q.type==="time3"){
    const h=parseInt(document.getElementById("ans_h").value,10);
    const m=parseInt(document.getElementById("ans_m").value,10);
    const s=parseInt(document.getElementById("ans_s").value,10);
    correct=(h===q.timeAns.h&&m===q.timeAns.m&&s===q.timeAns.s);
  }else{
    const inp=document.getElementById("ansInp");
    const val=inp?inp.value:"";
    correct=(normalize(val)===normalize(q.answer));
  }
  saveWorkSnapshot(qid);
  if(correct){
    solvedIds[qid]=true;
    saveCloud();
    const rid=qid.slice(0,2);
    const roomDone=roomProgress(rid)===5;
    const allDone=totalSolved()===30;
    if(allDone)pendingFinale=true;
    fb.innerHTML='<div class="fb-box fb-ok">🎉 정답이에요!<br>'+(roomDone?"이 방을 모두 클리어했어요!":"다음 QR 코드를 찾아 스캔해보세요!")+'</div><button class="btn btn-lg btn-primary" style="margin-top:12px" onclick="openScan()">📷 다음 QR 스캔하기</button><button class="btn btn-lg btn-sub" style="margin-top:8px" onclick="goHome()">홈으로</button>';
    document.querySelectorAll("#ansInp,#ans_h,#ans_m,#ans_s").forEach(el=>el.disabled=true);
    const sb=document.getElementById("submitBtn");if(sb)sb.disabled=true;
  }else{
    fb.innerHTML='<div class="fb-box fb-bad">❌ 정답이 아니에요. 다시 풀어보세요!</div>';
  }
}

/* ===================== 시작 ===================== */
if(myName&&safeKey){loadLocal();connectFirebase();renderHome();}
else{view="name";renderNameEntry();}
